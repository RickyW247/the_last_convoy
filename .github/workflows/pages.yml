name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pygbag
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare a web-only copy (MP3 -> OGG; pygbag rejects .mp3 files)
        run: |
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          find site -iname '*.mp3' | while read -r f; do
            ffmpeg -nostdin -y -loglevel error -i "$f" -c:a libvorbis -q:a 7 -ar 44100 "${f%.*}.ogg" || exit 1
            rm "$f"
          done
      - name: Build the web version
        run: python -m pygbag --build --title "The Last Convoy" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
